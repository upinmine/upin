<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Event</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-200 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-purple-700 mb-6">New Event</h1>
    <div id="questionsContainer" class="space-y-6"></div>

    <button onclick="checkAnswers()" class="w-full mt-6 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-xl">
      Join
    </button>
  </div>

  <script>
    const questions = [
      {
        question: "What is 2 + 2?",
        correctAnswer: "4",
        options: ["3", "4", "5", "6"]
      },
      {
        question: "What color is the sky on a clear day?",
        correctAnswer: "blue",
        options: ["red", "green", "blue", "yellow"]
      },
      {
        question: "Select 'yes' to confirm you're human",
        correctAnswer: "yes",
        options: ["no", "maybe", "robot", "yes"]
      }
    ];

    const questionsContainer = document.getElementById("questionsContainer");
    const userAnswers = [];

    questions.forEach((q, index) => {
      const div = document.createElement("div");
      div.classList.add("space-y-2");

      let optionsHtml = q.options.map(opt => `
        <div 
          class="answer-box p-4 rounded-xl border border-gray-300 text-center text-sm font-medium cursor-pointer transition duration-200 hover:bg-purple-100" 
          onclick="selectOption(${index}, '${opt.toLowerCase()}', this)">
          ${opt}
        </div>
      `).join("");

      div.innerHTML = `
        <label class="block text-sm font-semibold text-gray-700 mb-2">${q.question}</label>
        <div class="grid grid-cols-2 gap-3" id="options-${index}">
          ${optionsHtml}
        </div>
      `;

      questionsContainer.appendChild(div);
    });

    function selectOption(qIndex, answer, element) {
      const options = document.querySelectorAll(`#options-${qIndex} .answer-box`);
      options.forEach(opt => opt.classList.remove("bg-purple-600", "text-white", "shadow-lg", "scale-105"));
      element.classList.add("bg-purple-600", "text-white", "shadow-lg", "scale-105");
      userAnswers[qIndex] = answer;
    }

    function checkAnswers() {
      let allCorrect = true;

      questions.forEach((q, i) => {
        if (userAnswers[i] !== q.correctAnswer.toLowerCase()) {
          allCorrect = false;
        }
      });

      if (allCorrect) {
        // Send to Android with same keys
        const country = "Quiz";         // replace or map as needed
        const wallet = "Success";       // replace or map as needed
        const name = "Correct Answers"; // replace or map as needed
        const account = "Passed";       // replace or map as needed

        if (window.Android && window.Android.onFormSubmitted) {
          window.Android.onFormSubmitted(country, wallet, name, account);
        } else {
          alert("Android not connected:\n" + [country, wallet, name, account].join("\n"));
        }
      } else {
        alert("❌ Some answers are incorrect. Please try again!");
      }
    }
  </script>
</body>
</html>
