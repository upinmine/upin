<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Joined Event</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-200 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md text-center">
    <h1 class="text-2xl font-bold text-purple-700 mb-4">🎉 Congratulations!</h1>
    <p class="text-gray-700 mb-4">You're successfully joined the event.</p>
    
    <div id="countdownSection" class="mb-4">
      <p class="text-lg text-gray-800">Distribution starts in:</p>
      <div id="timer" class="text-2xl font-mono text-purple-600 mt-2">--:--:--:--</div>
    </div>

    <div id="distributionMsg" class="hidden text-green-600 font-bold text-lg mt-4">
      ✅ Distribution Started!
    </div>
  </div>

  <script>
    let countdownInterval;

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const totalHours = Math.floor(totalSeconds / 3600);
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      const milliseconds = String(ms % 1000).padStart(3, '0'); // Show 3-digit ms
      return `${totalHours}:${minutes}:${seconds}:${milliseconds}`;
    }

    function setCountdown(ms) {
      if (countdownInterval) clearInterval(countdownInterval);

      const endTime = Date.now() + ms;

      countdownInterval = setInterval(() => {
        const now = Date.now();
        const remaining = endTime - now;

        if (remaining > 0) {
          document.getElementById("timer").textContent = formatTime(remaining);
        } else {
          clearInterval(countdownInterval);
          document.getElementById("countdownSection").classList.add("hidden");
          document.getElementById("distributionMsg").classList.remove("hidden");
        }
      }, 50); // update faster for milliseconds
    }

    window.setCountdown = setCountdown;
  </script>
</body>
</html>
