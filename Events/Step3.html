<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Winners</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-200 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md text-center">
    <h1 class="text-2xl font-bold text-purple-700 mb-6">🏆 Event Winners</h1>

    <div class="space-y-4">
      <div class="bg-yellow-100 p-4 rounded-xl shadow text-yellow-700 font-semibold">
        🥇 1st Winner : <span id="firstWinner" class="font-bold">---</span>
      </div>
      <div class="bg-gray-200 p-4 rounded-xl shadow text-gray-800 font-semibold">
        🥈 2nd Winner : <span id="secondWinner" class="font-bold">---</span>
      </div>
      <div class="bg-amber-300 p-4 rounded-xl shadow text-amber-900 font-semibold">
        🥉 3rd Winner : <span id="thirdWinner" class="font-bold">---</span>
      </div>
    </div>
  </div>

  <script>
    // Function to set winner names dynamically from Android
    function setWinners(first, second, third) {
      document.getElementById("firstWinner").textContent = first;
      document.getElementById("secondWinner").textContent = second;
      document.getElementById("thirdWinner").textContent = third;
    }

    //Example use: window.setWinners("Ali", "Sara", "John");
    window.setWinners = setWinners;
  </script>
</body>
</html>
